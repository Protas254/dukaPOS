<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <g transform="translate(45, 30) scale(1.15)">
    <!-- 3D Extrusion Side & Bottom Faces (Vibrant Royal Blue Depth) -->
    <!-- Top-Right 3D Block Side -->
    <path d="M 190,75 L 235,100 L 235,175 L 190,150 Z" fill="#2563eb" />
    
    <!-- Top-Right 3D Block Inner Bottom Bevel -->
    <path d="M 140,150 L 190,150 L 235,175 L 185,175 Z" fill="#1d4ed8" />

    <!-- Center Fold Inner Shadow -->
    <path d="M 140,150 L 185,175 L 185,245 L 140,220 Z" fill="#1e40af" />

    <!-- Stem Right 3D Extrusion -->
    <path d="M 140,220 L 185,245 L 135,325 L 90,300 Z" fill="#2563eb" />

    <!-- Stem Bottom 3D Bevel -->
    <path d="M 90,300 L 135,325 L 110,345 L 65,320 Z" fill="#1e3a8a" />

    <!-- Stem Left 3D Extrusion (Back Shadow) -->
    <path d="M 65,115 L 65,320 L 110,345 L 110,140 Z" fill="#1d4ed8" opacity="0.95" />

    <!-- Front Face (Crisp White with Regal Blue Contour) -->
    <path d="
      M 65,115 
      L 110,65 
      L 110,100 
      L 190,75 
      L 190,150 
      L 140,150 
      L 140,220 
      L 90,300 
      L 65,320 
      Z
    " fill="#ffffff" stroke="#2563eb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
  </g>
</svg>
