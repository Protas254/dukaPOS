version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: dukapos
      POSTGRES_PASSWORD: dukapospassword
      POSTGRES_DB: dukapos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: 
      context: ./server
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./server:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://dukapos:dukapospassword@db:5432/dukapos_db
      - DEBUG=True
      - SECRET_KEY=local-dev-secret-key
    depends_on:
      - db

  client:
    build: 
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - server

volumes:
  postgres_data:
