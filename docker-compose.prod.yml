version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dukapos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dukapospassword}
      POSTGRES_DB: ${POSTGRES_DB:-dukapos_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dukapos} -d ${POSTGRES_DB:-dukapos_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: 
      context: ./server
      dockerfile: Dockerfile
    restart: always
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 server.wsgi:application
    ports:
      # Map to host port 8000 so the Load Balancer can route api.dukapos.com here
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-dukapos}:${POSTGRES_PASSWORD:-dukapospassword}@db:5432/${POSTGRES_DB:-dukapos_db}
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-api.dukapos.com,localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://dukapos.com,http://localhost:3000}
      - USE_S3=${USE_S3:-False}
    depends_on:
      db:
        condition: service_healthy

  client:
    build: 
      context: ./client
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      # Map to host port 3000 so the Load Balancer can route dukapos.com here
      - "3000:80"
    depends_on:
      - server

volumes:
  postgres_prod_data:
